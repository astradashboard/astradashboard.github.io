<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Détails des trades · ASTRA Dashboard</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #080b12; --panel: #121826; --panel2: #171e2e; --line: #232c3e; --fg: #eef1f6; --muted: #8f98ab; --gold: #c48a45; --gold2: #e2ab66; --win: #22c55e; --loss: #ef4444; }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(ellipse at 50% -10%, rgba(196,138,69,.18), transparent 55%), var(--bg); color: var(--fg);
    font: 15px/1.5 "Inter", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  .wrap { width: min(860px, 100% - 28px); margin: 0 auto; padding: 26px 0 50px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 26px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .16em; font-size: 13px; text-decoration: none; color: var(--fg); }
  .brand img { height: 32px; } .brand span { color: var(--gold2); }
  .cta { background: var(--gold); color: #0a0d14; font-weight: 700; font-size: 13.5px; padding: 9px 14px; border-radius: 10px; text-decoration: none; white-space: nowrap; }
  .kind { color: var(--gold2); font-weight: 800; letter-spacing: .14em; font-size: 12.5px; text-transform: uppercase; }
  h1 { margin: 4px 0 2px; font-size: clamp(24px, 5vw, 32px); letter-spacing: -.02em; }
  .who { color: var(--muted); font-size: 14px; }
  .big { font-size: clamp(42px, 11vw, 64px); font-weight: 850; letter-spacing: -.03em; margin: 18px 0 2px; }
  .sec { font-size: 18px; font-weight: 600; color: #c9cfdb; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 22px 0 26px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; }
  .tile small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 3px; }
  .tile b { font-size: 19px; }
  h2 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 0 0 10px; letter-spacing: .02em; }
  .list { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .tr { display: grid; grid-template-columns: 1.25fr 1fr .7fr .55fr 1fr 1fr 1fr; gap: 8px; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; font-size: 13.5px; }
  .tr:last-child { border-bottom: none; }
  .tr.h { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; background: var(--panel2); }
  .tr .r { text-align: right; }
  .side { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
  .side.b { background: rgba(34,197,94,.14); color: var(--win); } .side.s { background: rgba(239,68,68,.14); color: var(--loss); }
  .pos { color: var(--win); } .neg { color: var(--loss); }
  .more { color: var(--muted); font-size: 13px; padding: 12px 16px; }
  .note { color: #697287; font-size: 12.5px; margin-top: 22px; line-height: 1.6; }
  .empty { text-align: center; padding: 80px 10px; color: var(--muted); }
  .foot { margin-top: 30px; text-align: center; }
  .foot a { color: var(--gold2); font-weight: 600; }
  @media (max-width: 680px) {
    .tiles { grid-template-columns: 1fr 1fr; }
    .tr { grid-template-columns: 1fr auto; gap: 2px 10px; }
    .tr.h { display: none; }
    .tr > div { display: none; }
    .tr > .c-sym, .tr > .c-res { display: block; }
    .tr > .c-sym small { display: block; color: var(--muted); font-size: 12px; font-weight: 500; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="brand" href="../"><img src="../img/logo-emblem.png" alt=""><div>ASTRA <span>CAPITAL</span></div></a><a class="cta" href="../">Découvrir l'app</a></div>
  <div id="out"><div class="empty">Chargement des détails…</div></div>
  <div class="foot"><a href="../">ASTRA Dashboard · le dashboard des traders prop firm</a></div>
</div>
<script>
const MO = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = (v, d = 2) => Number(v).toLocaleString('fr-BE', { minimumFractionDigits: d, maximumFractionDigits: d });
const sgn = v => v > 0 ? '+' : v < 0 ? '−' : '';
async function decode(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
  const bytes = Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const txt = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  return JSON.parse(txt);
}
function label(k, p) {
  const f = (iso, o) => new Date(iso + 'T12:00:00').toLocaleDateString('fr-BE', o);
  if (k === 'day') { const s = f(p, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); return s[0].toUpperCase() + s.slice(1); }
  if (k === 'month') { const m = MO[+p.slice(5, 7) - 1]; return m[0].toUpperCase() + m.slice(1) + ' ' + p.slice(0, 4); }
  const e = new Date(p + 'T12:00:00'); e.setDate(e.getDate() + 6);
  return 'Semaine du ' + f(p, { day: 'numeric', month: 'long' }) + ' au ' + e.toLocaleDateString('fr-BE', { day: 'numeric', month: 'long', year: 'numeric' });
}
function fmtVal(v, d) { // valeur d'un trade selon l'unité choisie sur la carte
  if (d.u === 'pct') return sgn(v) + num(Math.abs(v)) + ' %';
  if (d.u === 'r') return sgn(v) + num(Math.abs(v), 2) + ' R';
  let s; try { s = new Intl.NumberFormat('fr-BE', { style: 'currency', currency: d.c || 'USD', currencyDisplay: 'narrowSymbol' }).format(Math.abs(v)); } catch (e) { s = num(Math.abs(v)) + ' ' + (d.c || ''); }
  return sgn(v) + s;
}
(async () => {
  const out = document.getElementById('out');
  const m = location.hash.match(/d=([A-Za-z0-9_-]+)/);
  if (!m) { out.innerHTML = '<div class="empty">Aucun détail à afficher. Ce lien s\'ouvre en scannant le QR code d\'une carte de résultats ASTRA.</div>'; return; }
  let d;
  try { d = await decode(m[1]); } catch (e) { out.innerHTML = '<div class="empty">Ce lien est incomplet ou ton navigateur est trop ancien pour l\'ouvrir.</div>'; return; }
  const kind = { day: 'Résultat du jour', week: 'Résultat de la semaine', month: 'Résultat du mois' }[d.k] || 'Résultat';
  const cls = v => v > 0 ? 'pos' : v < 0 ? 'neg' : '';
  const s = d.s || {};
  let h = `<div class="kind">${kind}</div><h1>${esc(label(d.k, d.p))}</h1><div class="who">${esc([d.h, d.a].filter(Boolean).join(' · '))}</div>`;
  h += `<div class="big ${cls(s.v)}">${fmtVal(s.v, d)}</div>`;
  const second = [];
  if (d.u === 'money' && s.pct != null) second.push(sgn(s.pct) + num(Math.abs(s.pct)) + ' %');
  if (d.u !== 'r' && s.r != null) second.push(sgn(s.r) + num(Math.abs(s.r), 1) + ' R');
  if (d.u === 'r' && s.pct != null) second.push(sgn(s.pct) + num(Math.abs(s.pct)) + ' %');
  if (second.length) h += `<div class="sec">${second.join(' · ')}</div>`;
  h += `<div class="tiles"><div class="tile"><small>Trades</small><b>${s.n ?? '—'}</b></div><div class="tile"><small>Taux de réussite</small><b>${s.wr == null ? '—' : Math.round(s.wr) + ' %'}</b></div>
    <div class="tile"><small>Gagnants / perdants</small><b>${(s.w ?? 0) + ' / ' + (s.l ?? 0)}</b></div><div class="tile"><small>Meilleur trade</small><b class="${cls(s.b)}">${s.b == null ? '—' : fmtVal(s.b, d)}</b></div></div>`;
  h += `<h2>Détail des positions</h2><div class="list"><div class="tr h"><div>Clôture</div><div>Symbole</div><div>Sens</div><div class="r">Lots</div><div class="r">Entrée</div><div class="r">Sortie</div><div class="r">Résultat</div></div>`;
  for (const t of d.t || []) {
    const [dt, sym, side, lots, op, cp, v] = t;
    const sd = side ? '<span class="side s">Short</span>' : '<span class="side b">Long</span>';
    const when = dt.slice(8, 10) + '/' + dt.slice(5, 7) + ' ' + dt.slice(11, 16);
    h += `<div class="tr"><div>${esc(when)}</div><div><b>${esc(sym)}</b></div><div>${sd}</div><div class="r">${num(lots, 2)}</div><div class="r">${op == null ? '—' : num(op, 2)}</div><div class="r">${cp == null ? '—' : num(cp, 2)}</div><div class="r ${cls(v)}"><b>${fmtVal(v, d)}</b></div>`;
    h += `<span class="c-sym" style="display:none"></span></div>`;
  }
  // version téléphone : symbole + date à gauche, résultat à droite
  h += `</div>`;
  if (d.m) h += `<div class="more">+ ${d.m} autre${d.m > 1 ? 's' : ''} trade${d.m > 1 ? 's' : ''} non affiché${d.m > 1 ? 's' : ''} (limite du QR code).</div>`;
  h += `<div class="note">Détails partagés par le trader depuis l'application ASTRA Dashboard, à partir de son historique MetaTrader 5${d.g ? ' (généré le ' + esc(d.g) + ')' : ''}. Ces informations sont fournies à titre indicatif et ne constituent pas un conseil en investissement. Les performances passées ne préjugent pas des performances futures.</div>`;
  out.innerHTML = h;
  // mobile : réorganise chaque ligne en « symbole + date » / « résultat »
  if (matchMedia('(max-width: 680px)').matches) {
    out.querySelectorAll('.tr:not(.h)').forEach(r => {
      const c = r.children, sym = c[1].textContent, when = c[0].textContent, side = c[2].innerHTML, res = c[6].innerHTML, cl = c[6].className;
      r.innerHTML = `<span class="c-sym"><b>${esc(sym)}</b> ${side}<small>${esc(when)} · ${c[3].textContent} lots · ${c[4].textContent} → ${c[5].textContent}</small></span><span class="c-res ${cl}" style="text-align:right">${res}</span>`;
    });
  }
})();
</script>
</body>
</html>
